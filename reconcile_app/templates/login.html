{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}

<div class="auth-wrap">
  <div class="auth">

    <div class="auth-brand">
      <div class="logo-circle">
        <span class="brand-icon" aria-hidden="true"></span>
      </div>
      <h1>Tally</h1>
      <p>Match records. Find what doesn't agree.</p>
    </div>

    <div class="sheet">
      <h2 style="margin-bottom:1.25rem">Log in to your account</h2>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text"
                 value="{{ username }}" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password"
                 autocomplete="current-password" required>
        </div>
        <div class="actions" style="margin-top:1.25rem">
          <button class="btn large" type="submit" style="flex:1">Log in</button>
        </div>
      </form>
    </div>

    <p style="text-align:center; font-size:.9rem; color:var(--ink-soft)">
      Don't have an account? <a href="{{ url_for('register') }}">Create one — it's free</a>
    </p>

  </div>
</div>

{% endblock %}
