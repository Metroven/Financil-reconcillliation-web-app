{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth sheet">
  <h1>Log in</h1>
  <p class="muted">Match two sets of records and see what doesn't agree.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="username">Username</label>
      <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <div class="actions"><button class="btn" type="submit">Log in</button>
      <a href="{{ url_for('register') }}">Create an account</a></div>
  </form>
</div>
{% endblock %}
