<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} – Tally</title>
  <meta name="description" content="Tally – reconcile two sets of financial records and instantly see what doesn't match.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <div class="in">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-icon" aria-hidden="true"></span>
      Tally
    </a>
    {% if g.user %}
      <a class="nav" href="{{ url_for('dashboard') }}"
         {% if request.endpoint == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
      <a class="nav" href="{{ url_for('files') }}"
         {% if request.endpoint in ('files','preview') %}aria-current="page"{% endif %}>My Files</a>
      <a class="nav" href="{{ url_for('history') }}"
         {% if request.endpoint in ('history','result') %}aria-current="page"{% endif %}>History</a>
      <span class="who">{{ g.user['username'] }}</span>
      <form method="post" action="{{ url_for('logout') }}" style="margin:0">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="linkbtn" type="submit">Log out</button>
      </form>
    {% else %}
      <a class="nav" href="{{ url_for('login') }}"
         {% if request.endpoint == 'login' %}aria-current="page"{% endif %}>Log in</a>
      <a class="nav" href="{{ url_for('register') }}"
         {% if request.endpoint == 'register' %}aria-current="page"{% endif %}>Create account</a>
    {% endif %}
  </div>
</header>

<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash {{ cat }}" role="alert">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
