{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="auth sheet">
  <h1>Create your account</h1>
  <p class="muted">Your uploaded files and results are private to your account.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="username">Username <span class="hint">3-32 letters, numbers, . - _</span></label>
      <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">Password <span class="hint">at least 8 characters</span></label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
    <div class="field"><label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required></div>
    <div class="actions"><button class="btn" type="submit">Create account</button>
      <a href="{{ url_for('login') }}">I already have an account</a></div>
  </form>
</div>
{% endblock %}
